<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
   <style>

    *{
      margin: 0px;
      padding: 0px;
      box-sizing: border-box;
      font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    html{
       height: 100%;
    }

    body{
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #f4f6f8;
    }

    .registration-page-container{
        height: 320px;
        width: 260px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .create{
      font-weight: 540;
      margin-bottom: 10px;
      font-family: Arial, Helvetica, sans-serif;
      color: #1daf42;
    }

    .box{
      height: 214px;
      width: 180px;
      border: 1px solid #e2e8f0;
      border-radius: 2px;
      background-color: #ffffff;
    }

    .extra-space{
      margin-top: 14px;
    }

    .field-group{
      display: flex;
      flex-direction: column;
      margin-bottom: 6px;
      width: 164px;
      gap: 2px;
      border-radius: 4px;
    }

    .field-label{
      margin-left: 14px;
      font-size: 8px;
      font-weight: bold;
      color: #0db537;
    }

    .field-input{
      margin-left: 14px;
      font-size: 8px;
      padding: 4px;
      border: 1px solid #cbd5e1f5;
      border-radius: 4px;
      outline: none;
    }

    .field-input:focus{
      border-color: #04e43c;
    }
    
    .checkbox-group{
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .check{
       margin-left: 14px;
       height: 10px;
       width: 10px;
       accent-color: #04e43c;
       cursor: pointer;
    }

    .terms{
      font-size: 8px;
    }

    .terms a, .already a{
      color: #0db537;
      text-decoration: none;
      font-weight: 600;
    }

    .terms a:hover, .already a:hover{
      text-decoration: underline;
    }

    .continue{
      margin-left: 14px;
      margin-top: 5px;
      width: 150px;
      padding: 5px;
      font-size: 8px;
      background-color: rgb(14, 193, 14);
      color: white;
      border:none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }

    .continue:hover{
      background-color: #0f9631;
    }

    .already{
      font-size: 8px;
    }
    
    
   </style>

</head>

<body>
  
  <div class="registration-page-container">
   <span class="create">
    Create your account
   </span>
   <form class="box">
      <label class="field-group extra-space">
         <span class="field-label">Name</span>
         <input class="field-input" type="text" placeholder="Enter your full name">
      </label>
      
      <label class="field-group">
         <span class="field-label">Company name</span>
         <input class="field-input" type="text" placeholder="Enter your company name">
      </label>

      <label class="field-group">
         <span class="field-label">Email</span>
         <input class="field-input" type="email" placeholder="Enter your email">
      </label>

      <label class="field-group">
         <span class="field-label">Password</span>
         <input class="field-input" type="password" placeholder="Enter your password">
      </label>

       <label class="checkbox-group">
         <input class="check" type="checkbox">
         <span class="terms">I accept <a href="">Terms & conditions</a></span>
      </label>
       
        <button type="submit" class="continue">
          Continue
        </button>
      

   </form>

   <div>
      <span class="already" >
        Already have an account?<a href=""> Log in</a>
      </span>
   </div>
  </div>

</body>

</html>
